<script>
    // First, define a helper function.
function animateScroll(duration, start, end) {
  var change = end - start;
  var increment = 20;
  function easeInOut(currentTime, start, change, duration) {
    // by Robert Penner
    currentTime /= duration / 2;
    if (currentTime < 1) {
      return change / 2 * currentTime * currentTime + start;
    }
    currentTime -= 1;
    return -change / 2 * (currentTime * (currentTime - 2) - 1) + start;
  }
  function animate(elapsedTime) {
    elapsedTime += increment;
    var position = easeInOut(elapsedTime, start, change, duration);
    someElement.scrollTop = position;
    if (elapsedTime < duration) {
      setTimeout(function() {
        animate(elapsedTime);
      }, increment)
    }
  }
  animate(0);
}
// Here's our main callback function we passed to the observer
function scrollLoop() {
  var duration = 64000 // Or however many milliseconds you want to scroll to last
  animateScroll(duration,someElement.scrollTop,someElement.scrollHeight);
setTimeout(function(){
someElement.scrollTo(0, 0);
setTimeout(function(){
scrollLoop();
},3000);
}, duration + 3000);
}
setTimeout(function(){
    //do what you need here
scrollLoop();
}, 2000);
</script>
<body>
