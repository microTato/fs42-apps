 
<html>
  <head>
    <style>
      body{background: linear-gradient(180deg,rgba(23, 173, 232, 1) 0%, rgba(255, 255, 255, 1) 77%, rgba(175, 194, 72, 1) 78%, rgba(237, 221, 83, 1) 100%);
        font-family: sans-serif;
        perspective: 1000px;
        padding-left: 5%;
    background-attachment: fixed;
      }
      h3{text-align:center;}
      h1{text-align:center;}
      small{margin-left:5px;}
      #poster{
        padding-left: 45%;
        height:70%;
        border-right:black solid 8px;
        transform: rotateY(-20deg);
      }
      #output{
        display:none;
      }
      #qr{
        margin:5px;
      }
      #info{
        margin:5px;
        font-size: large;
      }
      #bug{
        width:10%;
        opacity:0.5;
        position:absolute;
        left:90%;
        top:80%;
      }
      .side{
        padding-left:10px;
        box-shadow: inset 0 3px 6px rgba(0,0,0,0.16), 0 4px 6px rgba(0,0,0,0.45);
        border-radius: 10px;
        background-color: white;
        position: fixed;
        width:30%;
        height:auto;
        top: 0;
      }
    </style>
    <script>
      //https://gist.github.com/prof3ssorSt3v3/d7946ea634448c501dd8287cbe3f2c0b
        let baseURL = 'https://api.themoviedb.org/3/';
        let configData = null;
        let baseImageURL = null;
        let APIKEY = "null"; // Go get your own.
        
        let getConfig = function () {
            let url = "".concat(baseURL, 'configuration?api_key=', APIKEY); 
            fetch(url)
            .then((result)=>{
                return result.json();
            })
            .then((data)=>{
                baseImageURL = data.images.secure_base_url;
                configData = data.images;
                console.log('config:', data);
                console.log('config fetched');
                runSearch()
            })
            .catch(function(err){
                alert(err);
            });
        }
        
        let runSearch = function () {
            let url = ''.concat(baseURL, 'movie/popular?language=en-US&page=1&api_key=', APIKEY);
            fetch(url)
            .then(result=>result.json())
            .then((data)=>{
                //process the returned data
                document.getElementById('output').innerHTML = JSON.stringify(data, null, 4);
                //work with results array...
                let id = Math.floor(Math.random() * data.results.length)
                var rating = document.getElementById("vote_average")
                rating.innerHTML = data.results[id].vote_average;
                document.getElementById("title").innerHTML = data.results[id].title;
                document.getElementById("info").innerHTML = data.results[id].overview;
                document.getElementById("poster").src = "https://image.tmdb.org/t/p/w500" + data.results[id].poster_path;
                document.getElementById("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=www.themoviedb.org/movies/" + data.results[id].id;
                if (rating.innerHTML >= 7){
                  rating.style.color = "green";
                };
                if (rating.innerHTML < 7){
                  rating.style.color = "orange";
                };
                if (rating.innerHTML < 6){
                  rating.style.color = "red";
                };

            })
        }
        
        document.addEventListener('DOMContentLoaded', getConfig);
    </script>
  </head>
  <body>
    <div class="side">
    <h1 id="title"></h1>
    <h3 id="releasedate"></h3>
    <h3 id="vote_average" style="color:black;"></h3>
    <p id="info"></p>
    <img id="qr" src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=www.themoviedb.org/'></img><br>
    <small>Data provided by TMDB</small>
  </div>
  <div></div>
  <br><br><br><br><br><br><br>
    <div id="output">lol</div>
    <img id="poster" src="poster.jpg"></img>
    <img id="bug" src="bug.png"><!--this is the screen bug. delete this line if you dont want it-->
  </body>
</html>
